name: dotnet-ci
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Project/tests/EnergyMeter.Tests/EnergyMeter.Tests.csproj
      - run: dotnet build Project/tests/EnergyMeter.Tests/EnergyMeter.Tests.csproj --no-restore --configuration Release
      - run: dotnet test Project/tests/EnergyMeter.Tests/EnergyMeter.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'
